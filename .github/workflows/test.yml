name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.vscode/**'

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync --dev

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run black --check src tests

  behavior:
    name: Model behavior unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync --dev

      # Ядро модели психики должно вести себя одинаково от коммита к коммиту.
      # Прогон с фиксированным сидом сверяется с эталоном в tests/golden/.
      - name: Compare against golden run
        run: uv run pytest tests/test_golden_behavior.py -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
