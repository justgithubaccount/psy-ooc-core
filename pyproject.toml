[project]
name = "ooc-core"
version = "0.1.0"
description = "Object-Oriented Consciousness Core — модель психики как системы объектов, состояний и развития"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "justgithubaccount", email = "kulikovyevgeny@outlook.com" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "typer>=0.9.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.9.1",
]

[project.scripts]
ooc = "ooc.cli.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "ruff>=0.14.0",
    "black>=24.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # do not perform function calls in default arg (FastAPI Depends pattern)
